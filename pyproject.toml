[project]
name = "post-rag-chatbot"
version = "0.1.0"
description = "근거 기반 국제우편 규정 멀티턴 어시스턴트"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "chromadb>=1.3,<2",
  "langchain-chroma>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6.0,<7",
  "streamlit>=1.50,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/post_rag"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

